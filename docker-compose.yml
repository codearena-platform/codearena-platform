services:
  gateway:
    build:
      context: ..
      dockerfile: codearena-platform/Dockerfile.gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - IAM_URL=http://iam:7000
      - COMPETITION_URL=http://competition:7001
      - REALTIME_URL=http://realtime:8081
    depends_on:
      - iam
      - competition

  iam:
    build:
      context: ..
      dockerfile: codearena-platform/Dockerfile.iam
    ports:
      - "7000:7000"
    environment:
      # The IAM service reads SERVER_HOST/SERVER_PORT (not PORT).
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=7000
      - DB_HOST=mongodb://mongo:27017
      - REDIS_HOST=redis:6379
      - ENABLE_REDIS=true
      # Required: IAM refuses to start without a JWT secret and an encryption key.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - ENCRYPTER_KEY=${ENCRYPTER_KEY:?set ENCRYPTER_KEY in .env}
    depends_on:
      - mongo
      - redis

  competition:
    build:
      context: ..
      dockerfile: codearena-platform/Dockerfile.competition
    ports:
      - "50052:50052"
      - "7001:7001"
    environment:
      - PORT=7001
      - POSTGRES_DSN=postgres://user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/competition?sslmode=disable
      - MONGO_URI=mongodb://mongo:27017
      - SIMULATION_URL=simulation:50051
    depends_on:
      - mongo
      - postgres

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=competition
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongo_data:
  redis_data:
  postgres_data:
