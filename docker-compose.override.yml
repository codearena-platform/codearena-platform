services:
  gateway:
    depends_on:
      - iam
      - realtime

  realtime:
    build:
      context: ../codearena-core
      dockerfile: Dockerfile.realtime
    ports:
      - "8081:8081"
    environment:
      - PORT=:8081
      - ENGINE_ADDR=competition:50052
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
      - competition
