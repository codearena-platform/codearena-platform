name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      # go.mod uses a relative replace to ../codearena-core, so both
      # repositories must be checked out side by side.
      - uses: actions/checkout@v4
        with:
          path: codearena-platform
      - uses: actions/checkout@v4
        with:
          repository: codearena-platform/codearena-core
          path: codearena-core
      - uses: actions/setup-go@v5
        with:
          go-version-file: codearena-platform/go.mod
          cache-dependency-path: codearena-platform/go.sum
      - name: Verify formatting
        working-directory: codearena-platform
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: codearena-platform
        run: go vet ./...
      - name: Test
        working-directory: codearena-platform
        run: go test ./...
      - name: Build
        working-directory: codearena-platform
        run: go build ./...
